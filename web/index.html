<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Каталог библиотеки, читатели и выдачи книг">
  <meta name="theme-color" content="#3f51b5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Библиотека">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Библиотечная система</title>
  <style>
    html,body{height:100%;margin:0;background:#faf9ff;color:#1b1b21;font:16px Arial,sans-serif}
    #app-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:24px;text-align:center}
    #app-loading h1{font-size:24px;font-weight:500;margin:0}
    #app-loading p{margin:0;line-height:1.5}
    .spinner{width:36px;height:36px;border:4px solid #dfe2ff;border-top-color:#3f51b5;border-radius:50%;animation:spin 1s linear infinite}
    #loading-retry{padding:12px 24px;border:0;border-radius:24px;background:#3f51b5;color:white;font:inherit;cursor:pointer}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-color-scheme:dark){html,body{background:#111116;color:#e7e2ed}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <main id="app-loading" role="status" aria-live="polite">
    <h1>Библиотечная система</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-message">Загрузка приложения…</p>
    <button id="loading-retry" hidden onclick="location.reload()">Повторить</button>
    <noscript>Для работы приложения включите JavaScript.</noscript>
  </main>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
